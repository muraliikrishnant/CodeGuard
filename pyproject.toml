[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeguard"
version = "0.1.0"
description = "Git-aware secret scanner with LLM triage"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "detect-secrets>=1.4.0,<2.0",
    "pydantic>=2.0,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "gitpython>=3.1,<4.0",
    "google-generativeai>=0.8,<1.0",
    "anthropic>=0.40,<1.0",
    "tenacity>=8.0,<10.0",
    "jinja2>=3.1,<4.0",
]

[project.scripts]
codeguard = "codeguard.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
benchmark = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
]
frontend = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codeguard"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call real LLM APIs (deselect with -m 'not live')",
]
